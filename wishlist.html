<h2>My Wishlist</h2>
<div id="wishlist-container"></div>

<script>
let wishlist = JSON.parse(localStorage.getItem("wishlist")) || [];
let cart = JSON.parse(localStorage.getItem("cart")) || [];

function renderWishlist(){
  let container = document.getElementById("wishlist-container");
  container.innerHTML = "";

  wishlist.forEach((item,i)=>{
    container.innerHTML += `
      <div>
        <img src="${item.image}" width="100">
        <h3>${item.name}</h3>
        <p>₹${item.price}</p>

        <button onclick="addToCart(${i})">Add to Cart</button>
        <button onclick="removeItem(${i})">Remove</button>
      </div>
    `;
  });
}

function removeItem(i){
  wishlist.splice(i,1);
  localStorage.setItem("wishlist", JSON.stringify(wishlist));
  renderWishlist();
}

function addToCart(i){
  let item = wishlist[i];
  let existing = cart.find(p => p.name === item.name);

  if(existing){
    existing.qty++;
  } else {
    cart.push({...item, qty:1});
  }

  localStorage.setItem("cart", JSON.stringify(cart));
}

renderWishlist();
</script>
<script>
let wishlist = JSON.parse(localStorage.getItem("wishlist")) || [];

function toggleWishlist(el, name, price, image){

  let index = wishlist.findIndex(item => item.name === name);

  if(index !== -1){
    wishlist.splice(index,1);
    el.classList.remove("fa-solid");
    el.classList.add("fa-regular");
  } else {
    wishlist.push({name, price, image});
    el.classList.remove("fa-regular");
    el.classList.add("fa-solid");
  }

  localStorage.setItem("wishlist", JSON.stringify(wishlist));
}
</script>
<script>
function updateCartCountLive() {
  let cart = JSON.parse(localStorage.getItem("cart")) || [];

  let total = cart.reduce((sum, item) => sum + (item.qty || 0), 0);

  let el = document.getElementById("cart-count");
  if (el) el.innerText = total;
}

/* 🔥 INITIAL */
updateCartCountLive();

/* 🔥 CUSTOM EVENT LISTENER */
window.addEventListener("cartUpdated", updateCartCountLive);
</script>
